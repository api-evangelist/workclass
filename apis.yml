description: WorkClass is (or was) a Singapore-based job marketplace founded in 2020
  that matched frontline and blue-collar workers with employers, promising placement
  within 24 hours via matching algorithms. Backed by 500 Global, Goodwater Capital,
  Antler, and Kistefos, it surfaced here as a 500 Global portfolio lead. As of July
  2026 its primary domain workclass.co redirects to an unrelated UK website and
  workclass.com is parked for sale; no public API, developer portal, client packages,
  or GitHub organization were found.
